name: "process: replanning a habit with prior sessions reviews the preceding week first"
tier: decision
given:
  today: "2026-08-24"  # a Monday
  zones:
    - {label: Work, start: "09:00", end: "17:30", days: [Mon, Tue, Wed, Thu, Fri]}
  sleep_schedule: {sleep: "23:00", wake: "07:00", cool_down: 30, wake_up_buffer: 15}
  habits:
    - {label: Gym, goal: "180 min/week, sessions 30-60 minutes"}
  # A prior session for this same habit (h1, the first — and only —
  # habit above), dated in the week immediately before today, so
  # review_habit_week_precedes_replan has a "prior sessions exist" case
  # to actually exercise rather than trivially passing as not-applicable.
  calendar_events:
    - {summary: Gym, start: "2026-08-17T18:00:00", end: "2026-08-17T18:30:00", habit_id: "h1"}
when:
  user_says: "Plan my gym sessions for this week."
expect:
  tool_calls:
    - {name: add_calendar_event, min_count: 1}
  invariants:
    - no_session_overlaps_any_zone
    - no_session_overlaps_sleep_or_cooldown
    - every_habit_session_passes_habit_id
    - calendar_checked_before_habit_placement
    - list_habits_precedes_placement
    - review_habit_week_precedes_replan
    - explanation_cites_real_entities
