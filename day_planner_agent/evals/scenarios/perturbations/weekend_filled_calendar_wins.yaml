name: "perturbation: filling the weekend makes the calendar win over the weekend-loading preference"
tier: decision
given:
  today: "2026-08-24"  # a Monday
  zones:
    - {label: Work, start: "09:00", end: "17:30", days: [Mon, Tue, Wed, Thu, Fri]}
  sleep_schedule: {sleep: "23:00", wake: "07:00", cool_down: 30, wake_up_buffer: 15}
  habits:
    - {label: Gym, goal: "180 min/week, sessions 30-60 minutes"}
  # The perturbation: without this, a fully free weekend would normally
  # get more than its flat 2/7 share (see weekend_preferred_when_weekend_
  # is_free). Both weekend days are now fully booked all day, so the
  # preference has nowhere to land.
  calendar_events:
    - {summary: Wedding, start: "2026-08-29T08:00:00", end: "2026-08-29T22:00:00"}
    - {summary: "Family visit", start: "2026-08-30T08:00:00", end: "2026-08-30T22:00:00"}
when:
  user_says: "Plan my gym sessions for this week."
expect:
  tool_calls:
    - {name: add_calendar_event, min_count: 3}
  invariants:
    - no_session_overlaps_any_zone
    - no_session_overlaps_sleep_or_cooldown
    - no_session_overlaps_existing_events
    - every_habit_session_passes_habit_id
    - placed_minutes_meets_target
