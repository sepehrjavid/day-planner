name: "perturbation: a stated no-activity-after-8pm preference removes evening placements"
tier: decision
given:
  today: "2026-08-24"  # a Monday
  zones:
    - {label: Work, start: "09:00", end: "17:30", days: [Mon, Tue, Wed, Thu, Fri]}
  sleep_schedule: {sleep: "23:00", wake: "07:00", cool_down: 30, wake_up_buffer: 15}
  habits:
    - {label: Gym, goal: "60 min/week, sessions 60 minutes"}
  calendar_events: []
when:
  # The perturbation: this stated blackout window is the one input change
  # from what would otherwise be a wide-open 17:30-22:30 evening window.
  user_says: >
    I don't want any physical activity after 8pm. Plan my gym session for
    this week.
expect:
  tool_calls:
    - {name: add_calendar_event, min_count: 1}
  invariants:
    - no_physical_session_after_8pm
    - no_session_overlaps_any_zone
    - no_session_overlaps_sleep_or_cooldown
    - every_habit_session_passes_habit_id
