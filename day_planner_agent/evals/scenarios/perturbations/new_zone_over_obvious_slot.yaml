name: "perturbation: a new zone covering the obvious slot moves the session outside it"
tier: decision
given:
  today: "2026-08-24"  # a Monday
  zones:
    - {label: Work, start: "09:00", end: "17:30", days: [Mon, Tue, Wed, Thu, Fri]}
    # The perturbation: without this, early evening right after work is
    # the obvious slot for a single session. This zone covers exactly
    # that window on every weekday.
    - {label: "Evening Class", start: "18:00", end: "19:30", days: [Mon, Tue, Wed, Thu, Fri]}
  sleep_schedule: {sleep: "23:00", wake: "07:00", cool_down: 30, wake_up_buffer: 15}
  habits:
    - {label: Gym, goal: "60 min/week, sessions 60 minutes"}
  calendar_events: []
when:
  user_says: "Plan my gym session for this week."
expect:
  tool_calls:
    - {name: add_calendar_event, min_count: 1}
  invariants:
    - no_session_overlaps_any_zone
    - no_session_overlaps_sleep_or_cooldown
    - every_habit_session_passes_habit_id
