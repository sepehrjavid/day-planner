name: "perturbation: allowed_zones on the habit lets placements appear in work hours"
tier: decision
given:
  today: "2026-08-24"  # a Monday
  zones:
    - {label: Work, start: "09:00", end: "17:30", days: [Mon, Tue, Wed, Thu, Fri]}
  sleep_schedule: {sleep: "23:00", wake: "07:00", cool_down: 30, wake_up_buffer: 15}
  # The perturbation: allowed_zones: [Work] is the one input change from
  # an otherwise ordinary habit that would have to avoid the Work zone
  # like any other.
  habits:
    - {label: "Lunch Walk", goal: "60 min/week, sessions 15-20 minutes", allowed_zones: [Work]}
  calendar_events: []
when:
  user_says: >
    Plan my lunch walk sessions for this week — they happen during my
    work day, that's expected.
expect:
  tool_calls:
    - {name: add_calendar_event, min_count: 3}
  invariants:
    - no_session_overlaps_any_zone
    - no_session_overlaps_sleep_or_cooldown
    - every_habit_session_passes_habit_id
