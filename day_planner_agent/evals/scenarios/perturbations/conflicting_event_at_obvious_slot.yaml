name: "perturbation: a conflicting event at the obvious slot moves the session"
tier: decision
given:
  today: "2026-08-24"  # a Monday
  zones:
    - {label: Work, start: "09:00", end: "17:30", days: [Mon, Tue, Wed, Thu, Fri]}
  sleep_schedule: {sleep: "23:00", wake: "07:00", cool_down: 30, wake_up_buffer: 15}
  habits:
    - {label: Gym, goal: "60 min/week, sessions 60 minutes"}
  # The perturbation: without this, the first hour right after work on the
  # first weekday is the obvious, near-certain choice for a single 60min
  # session. Blocking exactly that forces the model to actually respond
  # to the calendar rather than defaulting to the same slot regardless.
  calendar_events:
    - {summary: "Team dinner", start: "2026-08-24T18:00:00", end: "2026-08-24T19:00:00"}
when:
  user_says: "Plan my gym session for this week."
expect:
  tool_calls:
    - {name: add_calendar_event, min_count: 1}
  invariants:
    - no_session_overlaps_any_zone
    - no_session_overlaps_sleep_or_cooldown
    - no_session_overlaps_existing_events
    - every_habit_session_passes_habit_id
