name: a habit with allowed_zones cool-down can be placed in the wind-down window
tier: constraint
given:
  today: "2026-08-24"  # a Monday
  zones: []
  sleep_schedule: {sleep: "23:00", wake: "07:00", cool_down: 30, wake_up_buffer: 15}
  habits:
    - {label: Reading, goal: "20-30 min/week, sessions 20-30 minutes", allowed_zones: ["cool-down"]}
  calendar_events: []
when:
  user_says: "Plan my reading session for tonight, right before bed is perfect."
expect:
  tool_calls:
    - {name: add_calendar_event, min_count: 1}
  invariants:
    - no_session_overlaps_sleep_or_cooldown
    - every_habit_session_passes_habit_id
