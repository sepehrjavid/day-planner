name: a zone-anchored habit tied to two zones is placed at both zones' own times
tier: constraint
given:
  today: "2026-08-24"  # a Monday
  zones:
    - {label: Work, start: "09:00", end: "17:30", days: [Mon, Tue, Wed, Thu, Fri]}
    - {label: "Commute (to office)", start: "08:00", end: "08:30", days: [Mon, Tue, Wed, Thu, Fri]}
    - {label: "Commute (from office)", start: "17:30", end: "18:00", days: [Mon, Tue, Wed, Thu, Fri]}
  sleep_schedule: {sleep: "23:00", wake: "07:00", cool_down: 30, wake_up_buffer: 15}
  habits: []
  calendar_events: []
when:
  user_says: >
    I listen to a podcast whenever I have either of my Commute zones, morning
    or evening. Plan this week.
expect:
  tool_calls:
    - {name: create_habit, min_count: 1}
    - {name: add_calendar_event, min_count: 5}
  invariants:
    - no_session_overlaps_any_zone
    - no_session_overlaps_sleep_or_cooldown
    - every_habit_session_passes_habit_id
    - zone_anchored_sessions_match_zone_times
