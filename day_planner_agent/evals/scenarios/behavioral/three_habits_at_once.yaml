name: three habits stated together are each placed and each meet their own target
tier: constraint
given:
  today: "2026-08-24"  # a Monday
  zones:
    - {label: Work, start: "09:00", end: "17:30", days: [Mon, Tue, Wed, Thu, Fri]}
  sleep_schedule: {sleep: "23:00", wake: "07:00", cool_down: 30, wake_up_buffer: 15}
  habits:
    - {label: Gym, goal: "60 min/week, sessions 30-45 minutes"}
    - {label: Tennis, goal: "60 min/week, sessions 60 minutes"}
    - {label: Yoga, goal: "40 min/week, sessions 20 minutes"}
  calendar_events: []
when:
  user_says: "Plan my gym, tennis, and yoga sessions for this week."
expect:
  tool_calls:
    - {name: add_calendar_event, min_count: 4}
  invariants:
    - no_session_overlaps_any_zone
    - no_session_overlaps_sleep_or_cooldown
    - every_habit_session_passes_habit_id
    - placed_minutes_meets_target
