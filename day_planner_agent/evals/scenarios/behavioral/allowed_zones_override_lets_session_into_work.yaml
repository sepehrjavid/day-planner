name: a habit with allowed_zones can legally be placed inside that zone
tier: constraint
given:
  today: "2026-08-24"  # a Monday
  zones:
    - {label: Work, start: "09:00", end: "17:30", days: [Mon, Tue, Wed, Thu, Fri]}
  sleep_schedule: {sleep: "23:00", wake: "07:00", cool_down: 30, wake_up_buffer: 15}
  habits:
    - {label: Lunch Walk, goal: "15-30 min/week, sessions 15-30 minutes", allowed_zones: [Work]}
  calendar_events: []
when:
  user_says: "Plan a lunch walk for this week, it's fine during work hours."
expect:
  tool_calls:
    - {name: add_calendar_event, min_count: 1}
  invariants:
    - no_session_overlaps_any_zone
    - no_session_overlaps_sleep_or_cooldown
    - every_habit_session_passes_habit_id
