name: does not choose the single most heavily booked day of the week
tier: decision
given:
  today: "2026-08-24"  # a Monday
  zones:
    - {label: Work, start: "09:00", end: "17:30", days: [Mon, Tue, Wed, Thu, Fri]}
  sleep_schedule: {sleep: "23:00", wake: "07:00", cool_down: 30, wake_up_buffer: 15}
  habits:
    - {label: Gym, goal: "60 min/week, sessions 30-60 minutes"}
  calendar_events:
    - {summary: "All-hands", start: "2026-08-25T17:30:00", end: "2026-08-25T19:00:00"}
    - {summary: "Team dinner", start: "2026-08-25T19:30:00", end: "2026-08-25T21:30:00"}
    - {summary: "Late call", start: "2026-08-25T21:45:00", end: "2026-08-25T22:15:00"}
when:
  user_says: "Plan a single gym session for this week."
expect:
  tool_calls:
    - {name: add_calendar_event, min_count: 1}
  invariants:
    - no_session_overlaps_any_zone
    - no_session_overlaps_sleep_or_cooldown
    - every_habit_session_passes_habit_id
    - chosen_slot_ranks_above_median
