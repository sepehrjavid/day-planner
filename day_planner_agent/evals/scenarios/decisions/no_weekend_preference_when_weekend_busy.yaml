name: weekend loading preference does not apply when the weekend already has plans
tier: decision
given:
  today: "2026-08-24"  # a Monday
  zones:
    - {label: Work, start: "09:00", end: "17:30", days: [Mon, Tue, Wed, Thu, Fri]}
  sleep_schedule: {sleep: "23:00", wake: "07:00", cool_down: 30, wake_up_buffer: 15}
  habits:
    - {label: Gym, goal: "180 min/week, sessions 30-60 minutes"}
  calendar_events:
    - {summary: "Wedding", start: "2026-08-29T12:00:00", end: "2026-08-29T23:00:00"}
    - {summary: "Family visit", start: "2026-08-30T10:00:00", end: "2026-08-30T20:00:00"}
when:
  user_says: "Plan my gym sessions for this week."
expect:
  tool_calls:
    - {name: add_calendar_event, min_count: 3}
  invariants:
    - no_session_overlaps_any_zone
    - no_session_overlaps_sleep_or_cooldown
    - every_habit_session_passes_habit_id
    - weekend_preferred_when_weekend_is_free
