name: session length scales down as the day gets busier, across three days
tier: decision
given:
  today: "2026-08-24"  # a Monday
  zones:
    - {label: Work, start: "09:00", end: "17:30", days: [Mon, Tue, Wed, Thu, Fri]}
  sleep_schedule: {sleep: "23:00", wake: "07:00", cool_down: 30, wake_up_buffer: 15}
  habits:
    - {label: Gym, goal: "120 min/week, sessions 20-60 minutes"}
  calendar_events:
    - {summary: "Board meeting", start: "2026-08-24T17:30:00", end: "2026-08-24T22:00:00"}
    - {summary: "Client dinner", start: "2026-08-25T18:00:00", end: "2026-08-25T20:00:00"}
when:
  user_says: "Plan my gym sessions for this week, aiming for three sessions."
expect:
  tool_calls:
    - {name: add_calendar_event, min_count: 3}
  invariants:
    - no_session_overlaps_any_zone
    - no_session_overlaps_sleep_or_cooldown
    - every_habit_session_passes_habit_id
    - heavier_load_on_lighter_days
